# Weekly version-update PRs for GWS-EA-only host dependencies, targeting the
# dogfood integration branch. Nothing merges itself. Upstream NanoClaw
# dependencies (and tightly pinned packages such as @chat-adapter/gchat and
# @onecli-sh/sdk) move via upstream syncs rather than Dependabot PRs. A
# cooldown holds new releases back as a guard against a bad or malicious
# publish: 7 days, 14 for majors.
version: 2

updates:
  # GWS-EA-only dependencies in the host pnpm project (pnpm-lock.yaml).
  - package-ecosystem: npm
    directory: /
    # release-tracks:start
    target-branch: 'dogfood'
    # release-tracks:end
    schedule:
      interval: weekly
      day: monday
      time: "06:00" # UTC, Dependabot's default timezone
    cooldown:
      default-days: 7
      semver-major-days: 14
    allow:
      # Strictly GWS-EA-only dependencies, excluding @chat-adapter/gchat and
      # @onecli-sh/sdk (which move with Chat SDK / OneCLI skill pins).
      - dependency-name: "@modelcontextprotocol/sdk"
      - dependency-name: "@whiskeysockets/baileys"
      - dependency-name: "google-auth-library"
      - dependency-name: "ipaddr.js"
      - dependency-name: "jose"
      - dependency-name: "mdast-util-from-markdown"
      - dependency-name: "mdast-util-gfm"
      - dependency-name: "micromark"
      - dependency-name: "micromark-extension-gfm"
      - dependency-name: "micromark-util-sanitize-uri"
      - dependency-name: "parse5"
      - dependency-name: "pino"
      - dependency-name: "playwright-core"
      - dependency-name: "rrule"
      - dependency-name: "tldts"
      - dependency-name: "undici"
      - dependency-name: "@types/mdast"
      - dependency-name: "ajv"
    groups:
      dev-minor-patch:
        dependency-type: development
        update-types: [minor, patch]
    labels: [dependencies, javascript]
    commit-message:
      prefix: chore
      include: scope
    open-pull-requests-limit: 5
