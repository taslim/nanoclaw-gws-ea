name: CI

on:
  pull_request:
    # Generated by pnpm run release-tracks:generate.
    # release-tracks:start
    branches:
      - 'main'
      - 'dogfood'
    # release-tracks:end
  # Post-merge runs keep both the prod (main) and dogfood lines independently
  # verified. Nothing below reads the pull_request payload.
  push:
    # release-tracks:start
    branches:
      - 'main'
      - 'dogfood'
    # release-tracks:end

# Read-only token for every job, whatever the repository default is.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# The static checks, the host suite and the container suite are independent,
# so each gets its own runner and the gate waits for the slowest one, not the
# sum. The host suite is cut into duration-balanced shards by scripts/ci-shard.ts,
# which verifies every discovered file is assigned to exactly one shard.
env:
  HOST_TEST_SHARDS: 4

jobs:
  checks:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
      - run: pnpm install --frozen-lockfile
      - name: Install agent-runner deps (Bun)
        working-directory: container/agent-runner
        run: bun install --frozen-lockfile

      - name: Check release track configuration
        run: pnpm run release-tracks:check

      - name: Verify balanced test shard partition
        run: node --import tsx scripts/ci-shard.ts verify "${{ env.HOST_TEST_SHARDS }}"

      - name: Format check
        run: pnpm run format:check

      - name: Typecheck host
        run: pnpm exec tsc --noEmit

      - name: Typecheck container
        run: pnpm exec tsc -p container/agent-runner/tsconfig.json --noEmit

  test:
    runs-on: ubuntu-26.04
    strategy:
      matrix:
        # PRs validate on Node 24 for faster feedback; pushes to main/dogfood run the full Node 22 + 24 matrix.
        node-version: ${{ github.event_name == 'pull_request' && fromJSON('[24]') || fromJSON('[22, 24]') }}
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
      - run: pnpm install --frozen-lockfile
      # Some host tests run agent-runner code under Bun, which needs the runner's own dependencies.
      - name: Install agent-runner deps (Bun)
        working-directory: container/agent-runner
        run: bun install --frozen-lockfile

      - name: Plan balanced test shard ${{ matrix.shard }} of ${{ env.HOST_TEST_SHARDS }}
        id: shard
        run: node --import tsx scripts/ci-shard.ts plan "${{ matrix.shard }}/${{ env.HOST_TEST_SHARDS }}" "$RUNNER_TEMP/shard-files.txt" >> "$GITHUB_OUTPUT"

      - name: Install completion test shells
        if: steps.shard.outputs.needs_shells == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends zsh fish lsof

      - name: Host tests including native browser fixtures, shard ${{ matrix.shard }} of ${{ env.HOST_TEST_SHARDS }}
        env:
          GWS_EA_FISH_TEST_BINARY: /usr/bin/fish
          GWS_EA_BROWSER_TEST_CHROME: /usr/bin/google-chrome
        run: |
          test -x "$GWS_EA_BROWSER_TEST_CHROME"
          mapfile -t shard_files < "$RUNNER_TEMP/shard-files.txt"
          test "${#shard_files[@]}" -gt 0
          xvfb-run --auto-servernum pnpm exec vitest run "${shard_files[@]}"

  container-test:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
      # GWS-EA's browser tool tests check their guidance with the host's runner-tools helper, which loads root packages.
      - run: pnpm install --frozen-lockfile
      - name: Install agent-runner deps (Bun)
        working-directory: container/agent-runner
        run: bun install --frozen-lockfile

      - name: Container tests
        working-directory: container/agent-runner
        run: bun run test

  iron-front:
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.1'
          cache-dependency-path: .claude/skills/add-iron-proxy/front-proxy/go.sum
      - name: Verify stock Iron and front proxy
        shell: bash
        run: |
          set -euo pipefail
          skill="$GITHUB_WORKSPACE/.claude/skills/add-iron-proxy"
          source_dir="$RUNNER_TEMP/stock-iron-source"
          source_url=$(jq -r '."iron-proxy-source"' "$skill/versions.json")
          revision=$(jq -r '."iron-proxy-commit"' "$skill/versions.json")
          git init "$source_dir"
          git -C "$source_dir" remote add origin "$source_url"
          git -C "$source_dir" fetch --depth=1 origin "$revision"
          git -C "$source_dir" checkout --detach FETCH_HEAD
          test "$(git -C "$source_dir" rev-parse HEAD)" = "$revision"
          cp -R "$skill/front-proxy" "$source_dir/_front-proxy"
          cd "$source_dir/_front-proxy"
          go test -mod=readonly -race -count=1 ./...
          test -z "$(gofmt -l .)"
          git -C "$source_dir" diff --exit-code

  # Skill pins sit outside the lockfile; .github/skill-pins mirrors them so
  # Dependabot and audit tools can see them. Red when the mirror is stale, or
  # when the signal-cli download hash is not GitHub's digest for its release.
  skill-pins:
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run skill-pins:check
      - name: signal-cli pin matches its release asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          f=setup/install-signal-cli.sh
          if [ "$(grep -cE '\b(VERSION|SHA256)=' "$f")" != 2 ]; then
            echo "::error file=$f::expected exactly one VERSION= line and one SHA256= line"
            exit 1
          fi
          v=$(sed -n 's/^VERSION="\([0-9.]*\)"$/\1/p' "$f")
          sha=$(sed -n 's/^SHA256="\([0-9a-f]*\)"$/\1/p' "$f")
          digest=$(gh api "repos/AsamK/signal-cli/releases/tags/v$v" \
            --jq ".assets[] | select(.name == \"signal-cli-$v-Linux-native.tar.gz\") | .digest")
          if [ "$digest" != "sha256:$sha" ]; then
            echo "::error file=$f::SHA256 is not GitHub's digest for v$v (${digest:-none}). If this PR bumps VERSION, set SHA256=\"${digest#sha256:}\". If it doesn't and SHA256 is unchanged too, the release asset changed after it was pinned: find out why before re-pinning, and don't re-pin in an unrelated PR."
            exit 1
          fi
      - name: gogcli pin digests and security advisories
        env:
          GH_TOKEN: ${{ github.token }}
        run: pnpm run gogcli:check

  # Repository rules require exact `ci`; always run it so matrix failures remain blocking.
  ci:
    if: always()
    needs: [checks, test, container-test, iron-front, skill-pins]
    permissions: {}
    runs-on: ubuntu-26.04
    steps:
      - run: |
          test "${{ needs.checks.result }}" = success
          test "${{ needs.test.result }}" = success
          test "${{ needs.container-test.result }}" = success
          test "${{ needs.iron-front.result }}" = success
          test "${{ needs.skill-pins.result }}" = success

  # The single check the main ruleset will require, in every repo under the same
  # name. Evaluates the exact same upstream jobs as `ci` in parallel so neither
  # context waits on the other and they cannot disagree. if: always() because a
  # skipped required check is not a failed one.
  gate:
    name: gate
    if: always()
    needs: [checks, test, container-test, iron-front, skill-pins]
    permissions: {}
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - name: every needed job succeeded
        run: |
          test "${{ needs.checks.result }}" = success
          test "${{ needs.test.result }}" = success
          test "${{ needs.container-test.result }}" = success
          test "${{ needs.iron-front.result }}" = success
          test "${{ needs.skill-pins.result }}" = success
